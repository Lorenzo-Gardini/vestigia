  terms-2.4: Borrowers may repay the outstanding balance early, in full or in part,
    at any time. Early repayment carries no additional fee.
  terms-3.1: Interest is charged monthly at a fixed annual rate of 4.2%. The rate
    does not change for the duration of the loan. Interest accrues daily on the outstanding
    balance and is added to each monthly instalment.
  faq-07: Late payments incur a charge of EUR 25 and may be reported to credit agencies
    after 30 days.
  support: Our customer service team is available Monday to Friday, 9:00 to 18:00.
